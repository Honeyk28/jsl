
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 9 - Web Storage</title>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Oswald', sans-serif;
        }

        body {
            background: #eaf3ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: 0.3s;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px #b8cde5;
            text-align: center;
        }

        h1 {
            color: #245b91;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #b8cde5;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 10px;
            background: #28669e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #174b79;
        }

        #message {
            margin-top: 18px;
            color: #245b91;
            line-height: 1.8;
        }

        .dark {
            background: #182536;
        }

        .dark .container {
            background: #263b52;
            color: white;
        }

        .dark h1, .dark #message {
            color: #d8eaff;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>My Preferences</h1>

        <input type="text" id="username" placeholder="Enter your name">

        <button onclick="saveName()">Save Name (localStorage)</button>
        <button onclick="saveSession()">Save Session Message</button>
        <button onclick="toggleTheme()">Toggle Theme</button>
        <button onclick="clearStorage()">Clear Storage</button>

        <div id="message"></div>
    </div>

    <script>
        // Restore saved preferences
        window.onload = function() {
            let savedName = localStorage.getItem("username");
            let theme = localStorage.getItem("theme");

            if (savedName) {
                document.getElementById("username").value = savedName;
            }

            if (theme === "dark") {
                document.body.classList.add("dark");
            }

            displayData();
        };

        // Store data permanently
        function saveName() {
            let name = document.getElementById("username").value.trim();

            if (name === "") {
                alert("Please enter your name.");
                return;
            }

            localStorage.setItem("username", name);
            displayData();
        }

        // Store data for current browser session
        function saveSession() {
            sessionStorage.setItem("message", "Welcome to your current session!");
            displayData();
        }

        // Save theme preference
        function toggleTheme() {
            document.body.classList.toggle("dark");

            let theme = document.body.classList.contains("dark")
                ? "dark" : "light";

            localStorage.setItem("theme", theme);
        }

        function displayData() {
            let name = localStorage.getItem("username") || "Not saved";
            let session = sessionStorage.getItem("message") || "Not saved";

            document.getElementById("message").innerHTML = `
                <h3>Stored Information</h3>
                Name: ${name}<br>
                Session: ${session}
            `;
        }

        function clearStorage() {
            localStorage.removeItem("username");
            localStorage.removeItem("theme");
            sessionStorage.clear();

            document.body.classList.remove("dark");
            document.getElementById("username").value = "";

            displayData();
        }
    </script>

</body>
</html>
