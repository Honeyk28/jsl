
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 4 - Palindrome Checker</title>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Oswald', sans-serif;
        }

        body {
            background: #eaf3ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px #b8cde5;
            text-align: center;
        }

        h1 {
            color: #245b91;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #b8cde5;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #28669e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #174b79;
        }

        #result {
            margin-top: 20px;
            color: #245b91;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Palindrome Checker</h1>

        <input type="text" id="word" placeholder="Enter a word or number">

        <button onclick="checkPalindrome()">Check</button>

        <div id="result"></div>
    </div>

    <script>
        // Global variable
        let totalChecks = 0;

        // Function expression
        const showMessage = function(message) {
            console.log(message);
        };

        // Closure: remembers the number of checks
        function createCounter() {
            let count = 0;

            return function() {
                count++;
                return count;
            };
        }

        const checkCount = createCounter();

        // Arrow function
        const reverseText = (text) => {
            return text.split("").reverse().join("");
        };

        // Function declaration
        function checkPalindrome() {
            try {
                let word = document.getElementById("word").value.trim();

                if (word === "") {
                    throw new Error("Please enter a word or number.");
                }

                let original = word.toLowerCase().replace(/[^a-z0-9]/g, "");
                let reversed = reverseText(original);

                if (original === "") {
                    throw new Error("Please enter valid text.");
                }

                let message = original === reversed
                    ? "It is a Palindrome!"
                    : "It is not a Palindrome!";

                totalChecks++;
                let count = checkCount();

                document.getElementById("result").innerHTML = `
                    <h3>${message}</h3>
                    <p>Reversed: ${reversed}</p>
                    <p>Total Checks: ${count}</p>
                `;

                showMessage(message);

            } catch (error) {
                document.getElementById("result").innerHTML =
                    `<p>${error.message}</p>`;
            }
        }
    </script>

</body>
</html>
