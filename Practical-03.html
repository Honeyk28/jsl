<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical 3 - Grading System</title>

    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Oswald', sans-serif;
        }

        body {
            background: #eaf3ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px #b8cde5;
            text-align: center;
        }

        h1 {
            color: #245b91;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #b8cde5;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #28669e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #174b79;
        }

        #result {
            margin-top: 22px;
            color: #245b91;
            line-height: 2;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Student Grading System</h1>

        <input type="text" id="name" placeholder="Student name">
        <input type="number" id="marks" placeholder="Enter marks (0-100)">

        <button onclick="calculateGrade()">Check Grade</button>

        <div id="result"></div>
    </div>

    <script>
        function calculateGrade() {
            let name = document.getElementById("name").value.trim();
            let marks = Number(document.getElementById("marks").value);
            let grade;

            if (name === "" || document.getElementById("marks").value === "") {
                alert("Please enter all details.");
                return;
            }

            if (marks < 0 || marks > 100) {
                alert("Marks must be between 0 and 100.");
                return;
            }

            // Conditional statements
            if (marks >= 90) {
                grade = "A+";
            } else if (marks >= 80) {
                grade = "A";
            } else if (marks >= 70) {
                grade = "B";
            } else if (marks >= 60) {
                grade = "C";
            } else if (marks >= 40) {
                grade = "D";
            } else {
                grade = "F (Fail)";
            }

            document.getElementById("result").innerHTML = `
                <h3>Result</h3>
                Student: ${name}<br>
                Marks: ${marks}<br>
                Grade: <strong>${grade}</strong>
            `;
        }
    </script>

</body>
</html>
